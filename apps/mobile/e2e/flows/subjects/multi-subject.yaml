# Flow N5: Multi-Subject Management — View and Navigate Subjects
# Validates: user with multiple subjects (active, paused, archived) can
# view subjects on home screen, navigate to Library v3 (single-pane shelf list),
# and return to home.
# Tags: pr-blocking, subjects
#
# Journey: UX Journey 1 (Subject Management)
# Epics: Epic 1 (FR10-FR14), Epic 4 (FR70-FR72)
# Prerequisite: Seeded user with Physics (active), Literature (paused),
#               Art History (archived) (scenario: multi-subject)
#
# testIDs verified against:
#   - apps/mobile/src/components/home/LearnerScreen.tsx (learner-screen,
#     home-subject-carousel, home-subject-card-${id})
#   - apps/mobile/src/app/(app)/library.tsx (shelves-list)
#   - apps/mobile/src/app/(app)/_layout.tsx (tab-library, tab-home)
#   - apps/mobile/src/app/(app)/progress/[subjectId]/index.tsx
#     (progress-subject-back, progress-subject-error)
#
# Subject progress leg (WI-2600, restoring the WI-2596-quarantined assertion):
#   Home subject cards route to shelf/[subjectId] since a148e4811 (2026-06-12),
#   so the progress screen is entered through its supported direct route
#   (openLink, mirroring flows/progress/resume-progress-subject.yaml). The flow
#   asserts the loaded state (progress-subject-back) and the absence of the
#   error state (progress-subject-error) for the seeded active subject.
appId: com.mentomate.app
tags:
  - pr-blocking
  - subjects
---
# 1. Seed & sign in
- runFlow:
    file: ../_setup/seed-and-sign-in.yaml
    env:
      SEED_SCENARIO: 'multi-subject'
      API_URL: ${API_URL}

# 2. Home screen loaded
- extendedWaitUntil:
    visible:
      id: 'learner-screen'
    timeout: 15000

# ── Visual integrity: tab bar ──────────────────────────────────────────
# All 3 tabs must render with correct testIDs. Catches missing icons (BUG-53),
# hidden tabs (BUG-10), and tab bar rendering failures.
- assertVisible:
    id: 'tab-home'
- assertVisible:
    id: 'tab-library'
- assertVisible:
    id: 'tab-more'

# ── Visual integrity: subject carousel ────────────────────────────────
# With active subjects, the carousel must render (not loading spinner forever).
# The carousel sits below the action chips on the current LearnerScreen layout,
# so scroll until it's on-screen before asserting.
- scrollUntilVisible:
    element:
      id: 'home-subject-carousel'
    direction: DOWN
    timeout: 10000

- assertVisible:
    id: 'home-subject-carousel'

# 3. Screenshot: home screen — captures what's actually rendering
- takeScreenshot: multi-subject-01-home

# 4. Physics (active subject) card MUST be visible in the now-on-screen carousel.
#    home-subject-card-${id} is the testID in LearnerScreen.tsx (home-subject-carousel).
#    seed-and-run.sh provides ACTIVE_SUBJECT_ID for the Physics subject.
- extendedWaitUntil:
    visible:
      id: 'home-subject-card-${ACTIVE_SUBJECT_ID}'
    timeout: 10000

# ── Negative assertions: empty-state must NOT appear with real data ───
# If seeded with subjects, the empty-state placeholder must not render.
- assertNotVisible:
    id: 'home-empty-subjects'

# 5. Navigate to Library tab (v3 single-pane shelf list)
- tapOn:
    id: 'tab-library'

# 6. Wait for Library v3 shelf list to render
- extendedWaitUntil:
    visible:
      id: 'shelves-list'
    timeout: 10000

# 7. Verify at least one shelf row is present for the active subject
- assertVisible:
    id: 'shelf-row-header-${ACTIVE_SUBJECT_ID}'

# 8. Screenshot: Library v3 content
- takeScreenshot: multi-subject-02-library

# 9. Navigate back to Home tab
- tapOn:
    id: 'tab-home'

# 10. Verify home screen is visible again
- extendedWaitUntil:
    visible:
      id: 'learner-screen'
    timeout: 10000

# 11. Tap the Physics subject card via testID.
#     home-subject-card-${id} is in LearnerScreen's carousel.
- tapOn:
    id: 'home-subject-card-${ACTIVE_SUBJECT_ID}'

# 12. Wait for the subject shelf opened by the home card.
- extendedWaitUntil:
    visible:
      id: 'shelf-screen'
    timeout: 10000

# 13. Return through the shelf's supported navigation, then select Home.
- tapOn:
    id: 'shelf-back'

- extendedWaitUntil:
    visible:
      id: 'shelves-list'
    timeout: 10000

- tapOn:
    id: 'tab-home'

# 14. Verify back on home screen after curriculum round-trip
- extendedWaitUntil:
    visible:
      id: 'learner-screen'
    timeout: 10000

# 15. Enter the subject progress screen for the seeded active subject via its
#     supported direct route (home cards open the shelf since a148e4811; the
#     retained progress/[subjectId] route is deep-link/direct entry — see the
#     architecture note in flows/progress/resume-progress-subject.yaml).
- openLink: 'mentomate:///progress/${ACTIVE_SUBJECT_ID}'

# 16. Subject progress screen renders its LOADED state: the back control is
#     present and the error state is absent (WI-2600 AC-2; assertion restored
#     un-weakened per WI-2596 AC-5).
- extendedWaitUntil:
    visible:
      id: 'progress-subject-back'
    timeout: 15000

- assertNotVisible:
    id: 'progress-subject-error'

# 17. Screenshot: subject progress loaded state
- takeScreenshot: multi-subject-04-subject-progress

# 18. Leave through the screen's own back control (exercises the restored
#     control, not just its presence).
- tapOn:
    id: 'progress-subject-back'

# 19. Verify back on home screen (deep link pushed onto the home stack, so
#     the back control pops to Home).
- extendedWaitUntil:
    visible:
      id: 'learner-screen'
    timeout: 10000

# 20. Final screenshot
- takeScreenshot: multi-subject-03-back-home
