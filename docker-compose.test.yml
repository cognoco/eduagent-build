services:
  test-db:
    image: pgvector/pgvector:pg16
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: eduagent_test
    volumes:
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-extensions.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U test -d eduagent_test &&
          psql -U test -d eduagent_test -tAc
          "SELECT count(*) = 2 FROM pg_extension WHERE extname IN ('vector', 'pg_trgm')"
          | grep -qx t
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
