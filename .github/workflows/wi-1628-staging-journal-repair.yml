name: WI-1628 Staging Journal Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect first; apply only after the dry-run receipt is reviewed'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
          - verify-applied
      confirmation:
        description: 'Apply only: WI-1628:DELETE:136,137'
        required: false
        default: ''
        type: string
      unrecovered_effects_ack:
        description: 'Apply only: WI-1628:ACCEPT:UNRECOVERED-STAGING-MIGRATION-EFFECTS'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize with push-to-main staging deploys. deploy.yml resolves its main
# concurrency group to this exact value.
concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: false

jobs:
  repair:
    name: Exact staging journal repair
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eduagent
          POSTGRES_PASSWORD: eduagent
          POSTGRES_DB: wi1628_baseline
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: true
      BASELINE_DATABASE_URL: postgresql://eduagent:eduagent@localhost:5432/wi1628_baseline

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          standalone: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Build clean migration-0166 baseline
        env:
          DATABASE_URL: ${{ env.BASELINE_DATABASE_URL }}
          WI1628_BASELINE_DIR: ${{ runner.temp }}/wi1628-migrations
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          mkdir -p "$WI1628_BASELINE_DIR/drizzle" .scratchpad
          cp -R apps/api/drizzle/. "$WI1628_BASELINE_DIR/drizzle/"
          rm "$WI1628_BASELINE_DIR/drizzle/0167_wi2534_resumable_family_join.sql"
          rm "$WI1628_BASELINE_DIR/drizzle/0167_wi2534_resumable_family_join.rollback.md"
          node --input-type=module - "$WI1628_BASELINE_DIR/drizzle/meta/_journal.json" <<'NODE'
          import fs from 'node:fs';

          const journalPath = process.argv[2];
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          journal.entries = journal.entries.filter((entry) => entry.idx < 167);
          if (journal.entries.length !== 165 || journal.entries.at(-1)?.idx !== 166) {
            throw new Error('Migration-0166 baseline shape changed; refusing repair');
          }
          fs.writeFileSync(journalPath, `${JSON.stringify(journal, null, 2)}\n`);
          NODE
          cat > .scratchpad/wi1628-baseline.config.ts <<'CONFIG'
          import { defineConfig } from 'drizzle-kit';

          if (!process.env.DATABASE_URL || !process.env.WI1628_BASELINE_DIR) {
            throw new Error('Baseline configuration is incomplete');
          }

          export default defineConfig({
            out: `${process.env.WI1628_BASELINE_DIR}/drizzle`,
            dialect: 'postgresql',
            dbCredentials: { url: process.env.DATABASE_URL },
          });
          CONFIG
          pnpm exec drizzle-kit migrate --config .scratchpad/wi1628-baseline.config.ts

      - name: Exercise repair transaction against disposable PostgreSQL
        env:
          WI1628_PG_INTEGRATION_URL: ${{ env.BASELINE_DATABASE_URL }}
        run: >-
          node --test
          packages/database/scripts/repair-migration-journal.pg.integration.test.mjs

      - name: Verify staging database target
        env:
          DEPLOY_ENV: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DATABASE_URL_STAGING_HOST: ${{ secrets.DATABASE_URL_STAGING_HOST }}
          DATABASE_URL_PRODUCTION_HOST: ${{ secrets.DATABASE_URL_PRODUCTION_HOST }}
        run: node packages/database/scripts/verify-db-target.mjs

      - name: Run exact repair command
        env:
          MODE: ${{ inputs.mode }}
          DEPLOY_ENV: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DATABASE_URL_STAGING_HOST: ${{ secrets.DATABASE_URL_STAGING_HOST }}
          DATABASE_URL_PRODUCTION_HOST: ${{ secrets.DATABASE_URL_PRODUCTION_HOST }}
          WI1628_REPAIR_CONFIRM: ${{ inputs.confirmation }}
          WI1628_UNRECOVERED_EFFECTS_ACK: ${{ inputs.unrecovered_effects_ack }}
          WI1628_RECEIPT_PATH: ${{ runner.temp }}/wi1628-repair-receipt.json
        run: |
          set -euo pipefail
          case "$MODE" in
            dry-run)
              node packages/database/scripts/repair-migration-journal.mjs --dry-run
              ;;
            apply)
              node packages/database/scripts/repair-migration-journal.mjs --apply
              ;;
            verify-applied)
              node packages/database/scripts/repair-migration-journal.mjs --verify-applied
              ;;
            *)
              echo 'Unsupported mode' >&2
              exit 1
              ;;
          esac

      - name: Upload repair receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wi-1628-staging-journal-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/wi1628-repair-receipt.json
          if-no-files-found: ignore
          retention-days: 30
