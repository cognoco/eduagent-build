# [BUG-979 / CCR-PR123-M-3] Nightly cleanup of orphaned Playwright seed
# accounts in the staging DB.
#
# The e2e-web workflow uses cancel-in-progress to short-circuit superseded
# runs. Playwright's globalTeardown (apps/mobile/e2e-web/helpers/global-teardown.ts)
# is the primary cleanup path; the per-job "Reset seeded staging accounts"
# step in e2e-web.yml is the secondary path. This workflow is the tertiary
# safety net for the rare hard-kill case where neither runs.
#
# It uses the local verified-ID cleanup script. Bulk Clerk mutation never runs
# in the Cloudflare Worker because the Worker has a 50-subrequest cap.

name: E2E Web Cleanup

on:
  schedule:
    # 03:17 UTC daily — off-peak for staging, after the typical CI day in
    # both EU and US timezones. The odd minute reduces chance of contention
    # with other scheduled cron jobs.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — log the call that would be made without executing it'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  reset:
    name: Reset orphaned seed accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Doppler CLI
        env:
          DOPPLER_TOKEN_STG: ${{ secrets.DOPPLER_TOKEN_STG }}
        run: |
          if [ -z "${DOPPLER_TOKEN_STG:-}" ]; then
            echo "::error title=Nightly cleanup cannot run::DOPPLER_TOKEN_STG is not configured"
            exit 1
          fi
          DOPPLER_VERSION="3.76.0"
          DOPPLER_ARCHIVE="doppler_${DOPPLER_VERSION}_linux_amd64.tar.gz"
          DOPPLER_SHA256="04f1ff30ed162d7af1dba7f11ad6a37ef35099de86a7ec6e261b64b1b337a3f3"
          curl -fsSLO "https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/${DOPPLER_ARCHIVE}"
          echo "${DOPPLER_SHA256}  ${DOPPLER_ARCHIVE}" | sha256sum -c -
          sudo tar -xzf "${DOPPLER_ARCHIVE}" -C /usr/local/bin doppler
          doppler --version

      - name: Clean stale seeded staging accounts
        env:
          API_URL: ${{ vars.E2E_API_URL || 'https://api-stg.mentomate.com' }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::error title=Nightly cleanup cannot run::DOPPLER_TOKEN_STG is not configured"
            exit 1
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            doppler run -p mentomate -c stg --preserve-env=API_URL -- \
              node scripts/clean-clerk-test-users.mjs --older-than-hours=24
          else
            doppler run -p mentomate -c stg --preserve-env=API_URL -- \
              node scripts/clean-clerk-test-users.mjs --older-than-hours=24 --execute
          fi
