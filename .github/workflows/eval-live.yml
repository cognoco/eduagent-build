name: Live LLM Evals

# [WI-452 / gate-spec D3] Tier-2 live evals + Layer-1 signal-drift guard.
# These burn LLM credits and are non-deterministic, so they must NEVER be a
# required PR check (determinism precondition) — they run OFF the blocking
# path: scheduled against main, label-triggered on a PR when an author wants
# a live read, or manually via workflow_dispatch. Before this workflow they
# ran nowhere automated (Windows-pathed local invocations only).
#
# Required repo labels (create in GitHub settings if missing):
#   run-live-evals — PR label that triggers this workflow on a PR
#   ci             — applied to auto-filed failure issues; the de-dup query
#                    filters on it (an absent label silently breaks de-dup:
#                    GitHub drops unknown labels on create, so duplicates
#                    would be filed every week)

on:
  schedule:
    # Weekly, Monday 04:23 UTC — off-hour to avoid the nightly e2e (03:00)
    # and top-of-hour load. Cadence is a cost/latency trade-off; tighten to
    # nightly if drift bites between runs.
    - cron: '23 4 * * 1'
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: eval-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  live-evals:
    name: Tier-2 live evals + drift check
    # Label gate: on PRs, run only when the `run-live-evals` label is applied
    # (the `labeled` event fires for every label — filter to ours).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-live-evals'
    runs-on: ubuntu-latest
    # Sequential-demand contract (WI-3029): envelope matrix reports
    # baseline=305 and required=329 samples; its 10% headroom configures 362.
    # Envelope provider demand: 329 outer runLive invocations + 37 internal judge
    # calls (31 legitimate_sensitive safety probes + 6 language-quality samples)
    # = 366 provider calls. Teaching remains 5 runLive invocations (≈85
    # internal calls). Mastery is an 8-scenario × 3-run grid: 216 governed
    # configured units and 192 expected provider calls. The comparable estimated
    # provider demand is 366 + 85 + 192 = 643; configured caps remain
    # gate-specific because these units are heterogeneous and must not be added
    # across gates.
    #
    # AC-6 timeout re-verification (WI-3029), from retained run 30721918215
    # (2026-08-01T22:44Z, pre-retune head) — NOT a fresh paid run; no paid
    # live run is authorized by this comment (AC-5 stands). Per-gate wall
    # clock from that run's job step timestamps: envelope 839s at its
    # then-cap of 300 calls (298 ok + 2 failed = 300, budget exhausted
    # exactly at the cap); teaching 271s at cap 5, un-truncated (5 ok, 0
    # failed) and unchanged from today's cap; mastery 710s, truncated to 21
    # of 24 scheduled rounds by its then-cap of 189 units ("budget requested
    # 24 rounds but --max-live-calls=189 (~9 calls/round) caps at 21. 3
    # round(s) dropped" per the run log). Projecting each gate's wall clock
    # onto CURRENT demand: envelope 839s x 366/300 (current provider demand
    # over that run's cap) + teaching 271s unscaled (already the full,
    # un-truncated current demand) + mastery 710s x 24/21 (the full 24-round
    # grid over the 21 rounds that actually ran) = ~35.1 min, leaving ~5.1×
    # headroom under this step's 180-minute timeout-minutes.
    #
    # Uncertainty, explicit: this is a single retained run on an older head,
    # not a distribution — no P90 exists. That run's envelope gate had 2
    # failed calls (unexplained, not chased here). OpenRouter provider/queue
    # latency varies run to run and could exceed what this one run saw. Only
    # envelope's 366 and mastery's 24 are freshly re-derived from the current
    # registries — the 300/21 denominators and all three wall-clock times are
    # historical facts read off this one run, not re-measured. Reverify from
    # a fresh operator-authorized run before tightening timeout-minutes.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          standalone: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Same pinned, checksum-verified Doppler CLI install as deploy.yml.
      # DOPPLER_TOKEN_STG is a config-scoped service token (stg) — live evals
      # read LLM provider keys from the staging config, never production.
      # `id: doppler` doubles as the setup guard for the later gate steps:
      # steps run in order, so a successful Doppler install implies checkout /
      # pnpm / node setup all succeeded (WI-2461 gate-independence contract,
      # scripts/eval-live-gate-independence.test.ts).
      - name: Install Doppler CLI
        id: doppler
        env:
          DOPPLER_TOKEN_STG: ${{ secrets.DOPPLER_TOKEN_STG }}
        run: |
          if [ -z "${DOPPLER_TOKEN_STG:-}" ]; then
            echo "::error title=Live evals cannot run::DOPPLER_TOKEN_STG is not set as a GitHub Actions secret — no LLM provider keys available."
            exit 1
          fi
          DOPPLER_VERSION="3.76.0"
          DOPPLER_ARCHIVE="doppler_${DOPPLER_VERSION}_linux_amd64.tar.gz"
          DOPPLER_SHA256="04f1ff30ed162d7af1dba7f11ad6a37ef35099de86a7ec6e261b64b1b337a3f3"
          curl -fsSLO "https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/${DOPPLER_ARCHIVE}"
          echo "${DOPPLER_SHA256}  ${DOPPLER_ARCHIVE}" | sha256sum -c -
          sudo tar -xzf "${DOPPLER_ARCHIVE}" -C /usr/local/bin doppler
          doppler --version

      # Tier 2 + Layer-1 drift in ONE invocation: --check-baseline requires
      # --live and runs the full live harness (real LLM calls validated
      # against expectedResponseSchema), then compares the envelope-signal
      # distribution against the committed baseline
      # (apps/api/eval-llm/baseline.json); exits 1 on either a schema failure
      # or drift beyond tolerance (default 5pp). Deliberately a single step —
      # a separate plain `--live` step would re-run the whole credit-burning
      # suite for no extra signal; failure attribution comes from the harness
      # output, not a step split. Flows without runLive degrade to Tier-1
      # behavior (see eval-llm/README). Non-deterministic by nature — that is
      # WHY it lives here and not in a required PR check.
      - name: Tier-2 live evals + signal-drift check
        id: envelope-gate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
        run: doppler run -- pnpm eval:llm -- --live --check-baseline --only-envelope-flows --max-live-calls 366

      # Teaching-session live gate (WI-2461). --only-envelope-flows above
      # filters to emitsEnvelope:true flows, and teaching-session deliberately
      # does NOT emit the envelope (it is judged on a transcript verdict, not
      # signal distribution) — so it needs its own dedicated step or it never
      # runs at all, which is exactly the blind spot that let the core
      # tutoring-quality flow go unwatched. Budget: --max-live-calls counts
      # runLive invocations, one per scenario × pinned profile, and the fixture
      # set is 5 scenarios (TS01–TS05, apps/api/eval-llm/fixtures/
      # teaching-scenarios.ts) → budget 5. Each runLive internally makes up to
      # ~17 real LLM calls (8 mentor + 7 learner + 1 transfer probe + 1 judge)
      # ≈ 85 calls total. A scenario-count change must retune this number in
      # the same PR — enforced by scripts/eval-live-gate-independence.test.ts.
      # A transfer-failed verdict is a qualityError → exit 1 → this step fails.
      # The gate also fails CLOSED (WI-2461 AC-3): an absent/unusable judge
      # verdict (no-verdict / judge-unavailable) is error-class too, and the
      # harness exits 1 whenever any live call failed to execute
      # (summary.liveCallsFailed > 0, eval-llm/runner/gates.ts) — so a judge
      # outage or provider failure can never read as a green teaching run.
      # Runs even if the envelope gate failed (`!cancelled()`), but not when
      # setup itself broke (`steps.doppler.outcome`). Scope caveat: the
      # scenario set is PRE-TEEN/TEEN-BAND PRE-SCREEN ONLY (11–17yo).
      - name: Teaching-session live gate (transfer + teaching quality)
        id: teaching-gate
        if: ${{ !cancelled() && steps.doppler.outcome == 'success' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
        run: doppler run -- pnpm eval:llm -- --live --flow teaching-session --max-live-calls 5

      # Mastery-SIMULATION gate (over-credit ceiling + drift). Tutor pinned to
      # gpt-oss-120b (MENTOR_MODEL, via OpenRouter) + production judge (the
      # minor-routed gpt-4o-mini under stg/V2-off) grade a distinct pinned
      # learner. The learner is meta-llama/llama-3.3-70b-instruct: a different
      # family from BOTH the gpt-4o-mini grader (gpt-4o, the documented learner,
      # COLLIDES → two-model guard hard-fails) and gpt-oss tutor, so the guard
      # holds. Budget: 8 challenge-sim scenarios × 3 runs × 9 governed
      # configured units/round (3 calls/question × MAX_CHALLENGE_QUESTIONS=3)
      # = 216. The separately reported expected provider demand is 8
      # calls/round, 192 total, leaving 24 calls: exactly three reproduce rounds
      # at 8 calls each for a single over-credit offender. That makes the
      # existing single-offender 3-round requalification path reachable.
      # Changing any of these numbers changes gate strictness, not just cost;
      # preflight still requires the governed 216 cap.
      # A reproduced over-credit breach exits 1 (the hard ceiling); soft drift
      # only warns. Distinct baseline from the signal one above — this reads
      # simulation-baseline.json. Seeded under DOPPLER_TOKEN_STG (same judge slug).
      # Runs even if an earlier gate failed (`!cancelled()`) so one gate's
      # failure can no longer mask this one's result (WI-2461); the job still
      # concludes failed when any gate genuinely failed.
      - name: Mastery-simulation gate (over-credit ceiling + drift)
        id: mastery-gate
        if: ${{ !cancelled() && steps.doppler.outcome == 'success' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
        run: >-
          doppler run -- pnpm --filter @eduagent/api eval:llm:sim --
          --learner-model meta-llama/llama-3.3-70b-instruct --runs 3
          --max-live-calls 216 --check-baseline

      # Alert on drift/break: scheduled runs have no PR surface to go red on,
      # so a silent failure would defeat the point (same rationale as the
      # BUG-953 deploy-failure issue). Only file from scheduled runs — label
      # and manual runs have a human watching.
      - name: Notify on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // De-dup: a standing failure (e.g. known quality issues pending a
            // re-baseline) must not file a new issue every week.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
              per_page: 100,
            });
            const existing = open.find((i) => i.title === 'Live LLM evals failed (scheduled run)');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing — latest run: ${runUrl}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Live LLM evals failed (scheduled run)`,
              body: [
                `## Scheduled live-eval failure`,
                ``,
                `A weekly live quality gate failed on \`main\` (the gates run`,
                `independently — check WHICH step(s) went red: envelope-flow`,
                `drift, teaching-session, or mastery-simulation).`,
                ``,
                `If it was the **Tier-2 live evals + signal-drift check**: either a`,
                `live response no longer matches its expectedResponseSchema, or the`,
                `envelope-signal distribution drifted beyond tolerance vs`,
                `\`apps/api/eval-llm/baseline.json\`.`,
                ``,
                `Run: ${runUrl}`,
                ``,
                `Triage: re-run to rule out provider flakiness; if drift is real and`,
                `intentional, re-baseline with`,
                `\`doppler run -- pnpm eval:llm -- --live --only-envelope-flows --update-baseline\` and commit.`,
                ``,
                `If the failing step was the **Teaching-session live gate**, read the`,
                `quality-issue codes in the run output first — the gate fails closed,`,
                `so red does NOT always mean the judge found a pedagogical failure.`,
                `A \`transfer-failed\` code means it did (the simulated learner could`,
                `not apply the concept after teaching): re-run once to rule out`,
                `provider flakiness and treat a reproduced transfer failure as a real`,
                `tutoring regression. \`no-verdict\` / \`judge-unavailable\` /`,
                `\`verdict-schema-invalid\` / \`provider-call-failed\` codes, or a`,
                `nonzero "Live calls failed" count, mean the run itself broke`,
                `(judge or provider failure) and say nothing about teaching quality —`,
                `fix or wait out the provider issue and re-run. There is no baseline`,
                `to re-seed for this gate.`,
                ``,
                `If the failing step was the **Mastery-simulation gate** (over-credit`,
                `ceiling / simulation-baseline.json drift), it is a DIFFERENT baseline —`,
                `re-seed with`,
                `\`doppler run -- pnpm --filter @eduagent/api eval:llm:sim -- --learner-model meta-llama/llama-3.3-70b-instruct --runs 3 --max-live-calls 216 --update-baseline\``,
                `and commit. A reproduced over-credit breach is a real grader-leniency`,
                `regression — fix the grader/prompt; do NOT raise the ceiling.`,
                ``,
                `Scope: the teaching-session flow is PRE-TEEN/TEEN-BAND PRE-SCREEN`,
                `ONLY (11–17yo) — it says nothing about under-10 or adult teaching`,
                `quality. A green run is not all-ages teaching quality.`,
              ].join('\n'),
              labels: ['ci'],
            });
